application:
  name: Career WatchPost
  environment: development
  timezone: Europe/Athens

database:
  backend: sqlite
  path: data/database/careeros.sqlite3

logging:
  level: INFO
  directory: logs

collection:
  enabled: true
  save_raw_pages: false
  request_delay_seconds:
    minimum: 4
    maximum: 8

ranking:
  maximum_daily_recommendations: 10
  require_explanation: true

privacy:
  redact_personal_identifiers: true
  allow_cv_text_to_external_models: false
  allow_application_history_to_external_models: false
