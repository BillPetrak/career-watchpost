[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careeros"
version = "1.0.0"
description = "A privacy-first career intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "CareerOS contributors" }
]
dependencies = [
    "defusedxml>=0.7.1,<0.8",
    "pypdf>=6.19,<7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
development = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20260724",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
careeros = "careeros.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"careeros.api" = ["static/*.html", "static/*.js", "static/*.css", "static/*.svg"]
"careeros.systemd" = ["*.service", "*.timer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src/careeros"]
