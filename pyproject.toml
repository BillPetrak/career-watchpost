[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careeros"
version = "0.1.0"
description = "A privacy-first career intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "CareerOS contributors" }
]
dependencies = []

[project.optional-dependencies]
development = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10"
]

[project.scripts]
careeros = "careeros.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["careeros"]
