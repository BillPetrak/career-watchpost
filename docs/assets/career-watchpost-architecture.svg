<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Career WatchPost local-first architecture</title>
  <desc id="desc">Public job feeds and private materials enter a local Python and SQLite core, which serves a loopback web interface and CLI.</desc>
  <style>.box{fill:#f7fafc;stroke:#1f2937;stroke-width:2;rx:12}.label{font:600 18px sans-serif;fill:#111827;text-anchor:middle}.small{font:14px sans-serif;fill:#374151;text-anchor:middle}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#head)}</style>
  <defs><marker id="head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker></defs>
  <rect class="box" x="30" y="80" width="190" height="110"/><text class="label" x="125" y="120">Public job feeds</text><text class="small" x="125" y="148">bounded collectors</text><text class="small" x="125" y="170">provider policies</text>
  <rect class="box" x="30" y="240" width="190" height="110"/><text class="label" x="125" y="280">Private inputs</text><text class="small" x="125" y="308">profile + Materials</text><text class="small" x="125" y="330">résumé provenance</text>
  <rect class="box" x="350" y="115" width="220" height="200"/><text class="label" x="460" y="155">Local CareerOS core</text><text class="small" x="460" y="190">Python + SQLite</text><text class="small" x="460" y="216">deterministic ranking</text><text class="small" x="460" y="242">review + workflow state</text><text class="small" x="460" y="268">schema 14</text>
  <rect class="box" x="700" y="80" width="190" height="110"/><text class="label" x="795" y="120">Loopback web UI</text><text class="small" x="795" y="148">FastAPI</text><text class="small" x="795" y="170">local browser</text>
  <rect class="box" x="700" y="240" width="190" height="110"/><text class="label" x="795" y="280">CLI + exports</text><text class="small" x="795" y="308">careeros commands</text><text class="small" x="795" y="330">local files only</text>
  <path class="arrow" d="M220 135 H350"/><path class="arrow" d="M220 295 H350"/><path class="arrow" d="M570 165 H700"/><path class="arrow" d="M570 265 H700"/>
</svg>
