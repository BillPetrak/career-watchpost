<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>CareerOS</title>
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <p class="brand">CareerOS</p>
    <nav class="nav" aria-label="Primary">
      <a href="#home" id="nav-home">Home</a>
      <a href="#jobs" id="nav-jobs">Jobs</a>
    </nav>
  </header>

  <main id="main">
    <section id="view-home" class="view" data-view="home" hidden>
      <h1>Overview</h1>
      <div id="home-status" class="status" role="status" aria-live="polite"></div>
      <div id="home-content" class="view-content"></div>
    </section>

    <section id="view-jobs" class="view" data-view="jobs" hidden>
      <h1>Jobs</h1>
      <form id="jobs-form" role="search" class="search-form">
        <label for="jobs-query">Search jobs</label>
        <input
          id="jobs-query"
          type="search"
          name="query"
          placeholder="e.g. engineer"
          autocomplete="off"
          spellcheck="false">
        <button type="submit">Search</button>
      </form>
      <div id="jobs-status" class="status" role="status" aria-live="polite"></div>
      <div id="jobs-content" class="view-content"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p id="footer-note">CareerOS read-only dashboard.</p>
  </footer>

  <script src="/ui/app.js"></script>
</body>
</html>
